<text x="160" y="165" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" fill="#1F2328" text-anchor="end">Unciv</text>
<rect x="172" y="149" width="124.2" height="22" rx="3" fill="#0072B2"/>
<text x="304.2" y="165" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12" fill="#1F2328">2.12x</text>
<text x="160" y="199" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" fill="#1F2328" text-anchor="end">Freeciv</text>
