<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 252" width="760" height="252" role="img" aria-label="Player-turns per minute">
<title>Player-turns per minute</title>
<rect width="760" height="252" fill="#FFFFFF"/>
