<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Turn time through the run">
<title>Turn time through the run</title>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="24" y="34" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="600" fill="#1F2328">Turn time through the run</text>
<text x="24" y="56" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" fill="#57606A">Each run stretched from its first turn to its last, so runs of different lengths line up. Lower is faster.</text>
