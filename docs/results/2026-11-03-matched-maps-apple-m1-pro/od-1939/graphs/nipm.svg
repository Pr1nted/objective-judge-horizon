<text x="24" y="56" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" fill="#57606A">Not ranked, largest first. Shown for: bytes moved per minute of play, both ways; more is not better or worse on its own.</text>
